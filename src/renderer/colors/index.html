<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Colors</title>
  <style>
    :root { --ink: #1b2338; --paper: #fffdf6; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #f4f0e6; color: var(--ink); font: 700 13px/1.3 Consolas, "Courier New", monospace; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    .wrap { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
    .stage { background: #dff3f8; border: 2px solid var(--ink); display: grid; place-items: center; height: 260px; position: relative; }
    .stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #f4e3b5; border-top: 2px solid #e6cf93; z-index: 0; }
    canvas { image-rendering: pixelated; width: 168px; height: 192px; position: relative; z-index: 1; }
    label.pick { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    input[type="color"] { width: 64px; height: 28px; border: 2px solid var(--ink); padding: 0; background: #fff; cursor: pointer; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .presets button { display: inline-flex; align-items: center; gap: 4px; }
    .sw { width: 12px; height: 12px; border: 1px solid var(--ink); display: inline-block; }
    button { font: inherit; border: 2px solid var(--ink); background: #fff; color: var(--ink); padding: 3px 8px; cursor: pointer; }
    button:hover { background: #eaf7fb; }
    button.primary { background: var(--ink); color: var(--paper); }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    input[type="text"] { font: inherit; border: 2px solid var(--ink); padding: 3px 6px; flex: 1; min-width: 0; }
    .muted { font-weight: 400; font-size: 12px; opacity: 0.75; }
    .custom-x { margin-left: 2px; padding: 0 4px; }
    footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  </style>
</head>
<body>
  <h1>Hangyodon colors</h1>
  <div class="wrap">
    <div class="stage"><canvas id="preview" width="42" height="48"></canvas></div>
    <div>
      <label class="pick">Skin <input type="color" id="skin"></label>
      <label class="pick">Fins <input type="color" id="fin"></label>
      <label class="pick">Belly <input type="color" id="belly"></label>
      <label class="pick">Lips <input type="color" id="lips"></label>
      <div class="muted">Highlights and shadows are worked out automatically.</div>
      <div class="row">
        <input type="text" id="preset-name" maxlength="24" placeholder="Name this look">
        <button type="button" id="save-preset">Save look</button>
      </div>
    </div>
  </div>
  <div class="presets" id="presets"></div>
  <footer>
    <button type="button" id="cancel">Cancel</button>
    <button type="button" id="apply" class="primary">Apply</button>
  </footer>
  <script src="../../shared/colors.js"></script>
  <script src="colors.js"></script>
</body>
</html>
